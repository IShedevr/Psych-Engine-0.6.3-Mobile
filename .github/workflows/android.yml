name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: IShedevr/Psych-Engine-0.6.3-Mobile
          ref: main
          clean: true
          fetch-depth: 1

      - name: Verify downloaded files
        run: |
          pwd
          ls -la
          git status --short
          find . -maxdepth 3 -iname 'Project.xml'

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp
          haxelib install lime 8.0.1
          haxelib set lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib set openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib set flixel 5.2.2
          haxelib path flixel
          find ~/haxelib -name FlxTypedGroup.hx
          haxelib run lime setup flixel
          haxelib install flixel-tools
          haxelib install flixel-ui
          haxelib install flixel-addons 3.0.2
          haxelib set flixel-addons 3.0.2
          haxelib install tjson
          haxelib install hxjsonast
          haxelib install hxCodec 2.5.1
          haxelib set hxCodec 2.5.1
          haxelib git linc_luajit https://github.com/IShedevr/linc_luajit
          haxelib install hscript
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib path flixel
          haxelib list
          find ~/haxelib -path '*/flixel/group/FlxTypedGroup.hx'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: false

      - name: Setup Lime Android Target
        run: |
          yes "" | haxelib run lime setup android

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config

      - name: Check Flixel installation
        run: |
          echo "=== HaxeFlixel version ==="
          haxelib list
          echo "=== HaxeFlixel path ==="
          haxelib path flixel
          echo "=== Search for FlxTypedGroup ==="
          find ~/haxelib . -name 'FlxTypedGroup.hx' 2>/dev/null || true
          
      
      - name: Check project location
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in workspace ==="
          ls -la "$GITHUB_WORKSPACE"
          echo "=== Find project file ==="
          find "$GITHUB_WORKSPACE" -iname 'project.xml' -o -iname 'project.hxml'
          echo "=== Git status ==="
          git status --short
          
      - name: Compile
        run: haxelib run lime build Project.xml android
        
      - name: Check LuaJIT ARM64 library
        if: always()
        run: |
          echo "=== Find LuaJIT libraries ==="
          find "$HOME/haxelib" -type f -iname '*luajit*.so*' 2>/dev/null || true
          echo "=== ARM64 ELF info ==="
          find "$HOME/haxelib" -type f -name 'libluajit-64.so' \
            -exec sh -c '
              file "$1"
              readelf -h "$1" | grep -E "Class:|Machine:"
              readelf -d "$1" | grep -E "SONAME|NEEDED" || true
            ' _ {} \;
            
      - name: Check packaged LuaJIT
        if: always()
        run: |
          find export -type f \( -name '*luajit*' -o -name 'libApplicationMain.so' \) -print 2>/dev/null
             
      - name: Diagnose LuaJIT in APK
        if: always()
        run: |
          echo "=== APK files ==="
          find . -type f -name '*.apk' -print

          echo "=== LuaJIT libraries in workspace ==="
          find . "$HOME/haxelib" -type f \
            \( -iname '*luajit*.so*' -o -iname '*luajit*.a' \) \
            2>/dev/null || true

          echo "=== APK native libraries and dependencies ==="
          mkdir -p /tmp/apk-check
          find . -type f -name '*.apk' -print0 |
          while IFS= read -r -d '' apk; do
            echo "--- Checking: $apk"
            rm -rf /tmp/apk-check/*
            unzip -oq "$apk" -d /tmp/apk-check

            find /tmp/apk-check/lib -type f -name '*.so' \
              -print 2>/dev/null || true

            find /tmp/apk-check -type f \
              -name 'libApplicationMain.so' \
              -exec sh -c '
                echo "=== Dependencies: $1 ==="
                readelf -d "$1" | grep NEEDED || true
              ' _ {} \;
          done
          
      - name: Find and Publish APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: |
            **/*.apk
          if-no-files-found: warn

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          
